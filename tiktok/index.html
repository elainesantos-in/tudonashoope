<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Conectar TikTok — Tudo na Shoope</title>
<style>body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:32px 16px;color:#3f2c20;background:#f7f1ea;line-height:1.6;text-align:center}code{display:block;word-break:break-all;background:#fff;padding:12px;border-radius:8px;margin:12px 0}button{padding:10px 18px;border:0;border-radius:8px;background:#8a5a3b;color:#fff;font-size:15px}</style></head><body>
<!-- Página de retorno do login do TikTok: mostra o código para a Elaine colar no PowerShell (o script tiktok-token.mjs troca pela chave). -->
<h1>Conectar TikTok</h1><div id="r"></div>
<script>
const q = new URLSearchParams(location.search), r = document.getElementById('r');
if (q.get('code')) {
  r.innerHTML = '<p>Deu certo! Copie o código abaixo e cole no Claude Code / PowerShell, como ele pediu:</p><code id="c"></code><button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent);this.textContent=\'Copiado ✓\'">Copiar código</button>';
  document.getElementById('c').textContent = q.get('code');
} else r.innerHTML = '<p>' + (q.get('error_description') || q.get('error') || 'Esta página recebe o retorno do login do TikTok.') + '</p>';
</script></body></html>
